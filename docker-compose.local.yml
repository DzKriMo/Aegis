services:
  aegis:
    build: .
    container_name: aegis-api
    ports:
      - "8000:8000"
    environment:
      AEGIS_ENV: dev
      AEGIS_API_KEY: changeme
      AEGIS_DB_ENABLED: "true"
      DATABASE_URL: sqlite:////data/aegis.db
      AEGIS_RATE_LIMIT_BACKEND: redis
      AEGIS_RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      AEGIS_OLLAMA_BASE_URL: http://host.docker.internal:11434
      AEGIS_LLM_ENABLED: "true"
      AEGIS_MODEL_ENABLED: "true"
      AEGIS_LLM_ENDPOINT: http://host.docker.internal:11434/v1/chat/completions
      AEGIS_MODEL_ENDPOINT: http://host.docker.internal:11434/v1/chat/completions
      AEGIS_LLM_MODEL: qwen2.5:7b-instruct
      AEGIS_MODEL_NAME: qwen2.5:7b-instruct
      AEGIS_LOCAL_CLASSIFIER_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      - aegis_data:/data
  redis:
    image: redis:7
    container_name: aegis-redis
    ports:
      - "6379:6379"

volumes:
  aegis_data:
